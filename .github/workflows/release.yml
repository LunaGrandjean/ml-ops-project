name: Build and deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      model_uri:
        description: Numbered MLflow URI (blank uses repository MODEL_URI)
        type: string
        required: false
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      model_uri: {type: string, required: true}
      promotion_locked: {type: boolean, default: false}
permissions: {contents: read}
# Retraining already holds production until its called release finishes.
concurrency:
  group: ${{ inputs.promotion_locked && format('release-{0}', github.run_id) || 'production' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.config.outputs.sha }}
      model_uri: ${{ steps.config.outputs.model_uri }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.source_sha || github.sha }}"}
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.23"}
      - name: Validate release configuration
        id: config
        env:
          RELEASE_MODEL_URI: ${{ inputs.model_uri || vars.MODEL_URI }}
          DEPLOY_ENABLED: ${{ vars.ENABLE_K8S_DEPLOY }}
        run: python scripts/release_config.py
      - run: uv sync --frozen --extra dev --extra ml --extra pipeline --extra ui
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m pytest -m "not e2e"
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix: {target: [api, ui, tracking]}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.verify.outputs.sha }}"}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/trajectory-${{ matrix.target }}:${{ needs.verify.outputs.sha }}
  deploy:
    needs: [verify, publish]
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}
    environment: production
    runs-on: ${{ fromJSON(vars.MLOPS_RUNNER_LABELS || '["self-hosted","macOS","mlops"]') }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MODEL_URI: ${{ needs.verify.outputs.model_uri }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ needs.verify.outputs.sha }}"}
      - name: Deploy to local Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODEL_URI"
          kubectl apply -f k8s/namespace.yaml
          kubectl -n trajectory-mlops create secret generic storage-credentials \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/storage.yaml
          kubectl -n trajectory-mlops wait --for=condition=available deployment/minio --timeout=180s
          kubectl -n trajectory-mlops delete job init-buckets --ignore-not-found
          kubectl apply -f k8s/init-buckets.yaml
          kubectl -n trajectory-mlops wait --for=condition=complete job/init-buckets --timeout=180s
          python3 scripts/render_k8s.py --registry "$DOCKERHUB_USERNAME" \
            --tag "$RELEASE_SHA" --model-uri "$MODEL_URI"
          kubectl apply -f k8s/rendered/apps.yaml
          kubectl -n trajectory-mlops rollout status deployment/mlflow --timeout=300s
          kubectl -n trajectory-mlops rollout status deployment/api --timeout=300s
          kubectl -n trajectory-mlops rollout status deployment/ui --timeout=180s
      - name: Smoke test inference inside cluster
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n trajectory-mlops run "smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --rm --attach --restart=Never \
            --image="$DOCKERHUB_USERNAME/trajectory-api:$RELEASE_SHA" \
            --command -- python -m trajectory_mlops.api.smoke \
            --url http://api:8000 --model-uri "$MODEL_URI"
