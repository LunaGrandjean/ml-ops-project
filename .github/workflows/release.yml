name: Build and deploy
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: production, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.23"}
      - run: uv sync --frozen --extra dev --extra ml
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m pytest -m "not e2e"
  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix: {target: [api, ui, tracking]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/trajectory-${{ matrix.target }}:${{ github.sha }}
  deploy:
    needs: publish
    if: ${{ vars.ENABLE_K8S_DEPLOY == 'true' }}
    environment: production
    runs-on: [self-hosted, linux, mlops]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      MODEL_URI: ${{ vars.MODEL_URI }}
      MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
      MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to local Kubernetes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MODEL_URI"
          kubectl apply -f k8s/namespace.yaml
          kubectl -n trajectory-mlops create secret generic storage-credentials \
            --from-literal=MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            --from-literal=MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/storage.yaml
          kubectl -n trajectory-mlops wait --for=condition=available deployment/minio --timeout=180s
          kubectl -n trajectory-mlops delete job init-buckets --ignore-not-found
          kubectl apply -f k8s/init-buckets.yaml
          kubectl -n trajectory-mlops wait --for=condition=complete job/init-buckets --timeout=180s
          python3 scripts/render_k8s.py --registry "$DOCKERHUB_USERNAME" \
            --tag "$GITHUB_SHA" --model-uri "$MODEL_URI"
          kubectl apply -f k8s/rendered/apps.yaml
          kubectl -n trajectory-mlops rollout status deployment/mlflow --timeout=300s
          kubectl -n trajectory-mlops rollout status deployment/api --timeout=300s
          kubectl -n trajectory-mlops rollout status deployment/ui --timeout=180s
      - name: Smoke test inside cluster
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n trajectory-mlops run "smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --rm --attach --restart=Never \
            --image="$DOCKERHUB_USERNAME/trajectory-api:$GITHUB_SHA" \
            --command -- python -c \
            "import urllib.request; urllib.request.urlopen('http://api:8000/health/ready')"
