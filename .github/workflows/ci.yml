name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.23", enable-cache: true}
      - run: uv sync --frozen --extra dev
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m pytest -m "not ml and not e2e"
      - name: Validate Compose
        env: {MINIO_ROOT_USER: ci-user, MINIO_ROOT_PASSWORD: ci-placeholder-password}
        run: docker compose config --quiet
  model-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.12.23", enable-cache: true}
      - run: uv sync --frozen --extra ml --extra dev
      - run: uv run python -m pytest -m ml
  container:
    needs: [quality, model-integration]
    runs-on: ubuntu-latest
    strategy:
      matrix: {target: [api, ui, tracking]}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: trajectory-${{ matrix.target }}:ci
